name: kinly
description: Kinly - offline, end-to-end encrypted family chat.
publish_to: "none"
version: 1.1.3+4

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_webrtc: ^1.6.3
  uuid: ^4.2.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  file_selector: ^1.0.3
  image: ^4.3.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  google_mlkit_text_recognition: ^1.0.3
  crypto: ^3.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
