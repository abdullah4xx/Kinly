name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          RAW=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          echo "VERSION_NAME=${RAW%%+*}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${RAW##*+}" >> "$GITHUB_ENV"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${RAW%%+*}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $RAW"
            exit 1
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the signing secrets from PLAN.md section 9.3 before tagging a release."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;28.2.13676358" > /tmp/ndk.log 2>&1 || {
              tail -50 /tmp/ndk.log; exit 1;
            }
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build core for Android
        working-directory: core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            --platform 28 \
            -o ../app/android/app/src/main/jniLibs \
            build --release

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/app/android/keystore.jks
          EOF

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk

      - name: Collect files
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/kinly-$VERSION_NAME.apk"
          (cd dist && sha256sum "kinly-$VERSION_NAME.apk" > "kinly-$VERSION_NAME.apk.sha256")

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/kinly-$VERSION_NAME.apk
          if-no-files-found: error

  linux:
    name: Linux build
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel clang cmake ninja gtk3 pkgconf curl unzip git tar xz

      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-x64

      - name: Install Flutter
        run: |
          git config --global --add safe.directory '*'
          if [ ! -x /opt/flutter/bin/flutter ]; then
            curl -fsSL -o /tmp/flutter.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            mkdir -p /opt
            tar -xJf /tmp/flutter.tar.xz -C /opt
          fi
          ln -sf /opt/flutter/bin/flutter /usr/local/bin/flutter
          flutter config --no-analytics

      - name: Build Linux app
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        run: |
          mkdir -p dist
          cp -r app/build/linux/x64/release/bundle dist/kinly
          tar -czf "dist/kinly-${VERSION_NAME}-linux-x86_64.tar.gz" -C dist kinly
          (cd dist && sha256sum "kinly-${VERSION_NAME}-linux-x86_64.tar.gz" > "kinly-${VERSION_NAME}-linux-x86_64.tar.gz.sha256")

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
